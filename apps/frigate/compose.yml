services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: frigate-mqtt
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  frigate:
    image: ghcr.io/blakeblackshear/frigate:${FRIGATE_VERSION:-stable}
    container_name: frigate
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "${FRIGATE_SHM_SIZE:-256mb}"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/video0:/dev/video0
      - /dev/v4l/by-id/usb-046d_HD_Pro_Webcam_C920_7D1BAAAF-video-index0:/dev/logitech-c920
    ports:
      - "${FRIGATE_UI_PORT:-8971}:8971"
      - "127.0.0.1:${FRIGATE_INTERNAL_PORT:-5000}:5000"
      - "127.0.0.1:${FRIGATE_RTSP_PORT:-8554}:8554"
      - "${FRIGATE_WEBRTC_PORT:-8555}:8555/tcp"
      - "${FRIGATE_WEBRTC_PORT:-8555}:8555/udp"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
      - ./media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    environment:
      LIBVA_DRIVER_NAME: iHD
    depends_on:
      - mqtt

volumes:
  mosquitto_data:
  mosquitto_log:
