services:
  home:
    image: nginx:1.27-alpine
    container_name: homelab-home
    restart: unless-stopped
    ports:
      - "${HOME_PORT:-80}:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - home_status:/usr/share/nginx/status:ro
    depends_on:
      - status

  status:
    image: docker:cli
    container_name: homelab-status
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/app/docker-status.sh"]
    environment:
      STATUS_INTERVAL: "${STATUS_INTERVAL:-10}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-status.sh:/app/docker-status.sh:ro
      - home_status:/status-out

volumes:
  home_status:
